<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
  <!-- Nomo brand wash for LIGHT mode. Exact BrandPalette hexes:
       claudeCoral #D97757 -> codexViolet #7A5CF0.
       No intrinsic px size + preserveAspectRatio="none" so it stretches to any
       viewport width. Safe to distort: it's a gradient, there are no shapes. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#C0699E" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7A5CF0" stop-opacity="0.26" />
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="1" />
      <stop offset="70%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="topfade">
      <rect width="100" height="100" fill="url(#fade)" />
    </mask>
  </defs>
  <rect width="100" height="100" fill="url(#brand)" mask="url(#topfade)" />
</svg>
